name: Unified React App Deployment

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Map trigger → environment
    strategy:
      matrix:
        include:
          - condition: github.event_name == 'pull_request'
            env_name: dev
          - condition: >
              github.event_name == 'push'
            env_name: qa
          - condition: github.event_name == 'release'
            env_name: production

    # Only run the one that matches the condition
    if: ${{ fromJSON(matrix.condition) }}

    environment: ${{ matrix.env_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "Deploying to ${{ matrix.env_name }} environment..."
          echo "${{ vars.Test }}"
